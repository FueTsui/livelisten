[workspace]
resolver = "3"
members = ["crates/*", "setup"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
base64 = "0.22"
cpal = "0.16"
directories = "6"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
